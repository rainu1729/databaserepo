# ============================================================
# Liquibase PR Validation Pipeline (Phase 1)
# ============================================================
# Runs dry-run validation checks on pull requests targeting master:
#   1. Check that all SQL files are registered in changelog XMLs
#   2. Validate Liquibase changelog XML syntax
#   3. Preview SQL changes (update-sql dry run) in logs and PR
# ============================================================

name: Liquibase PR Validation

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate Database Changes
    runs-on: ubuntu-latest

    env:
      TNS_ADMIN: ${{ github.workspace }}/wallet

    steps:
      # --------------------------------------------------------
      # Step 1: Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Step 2: Check changelog registration
      # --------------------------------------------------------
      - name: Check changelog registration
        run: |
          chmod +x scripts/sync-changelog.sh
          ./scripts/sync-changelog.sh --check

      # --------------------------------------------------------
      # Step 3: Restore Oracle Wallet from GitHub Secrets
      # --------------------------------------------------------
      - name: Decode and extract Oracle Wallet
        run: |
          mkdir -p ${TNS_ADMIN}
          echo "${{ secrets.ORACLE_WALLET_BASE64 }}" | base64 -d > wallet.zip
          unzip -o wallet.zip -d ${TNS_ADMIN}
          rm wallet.zip
          echo "✅ Wallet extracted to ${TNS_ADMIN}"
          ls -la ${TNS_ADMIN}

      # --------------------------------------------------------
      # Step 4: Configure wallet for JDBC (JKS mode)
      # --------------------------------------------------------
      - name: Configure ojdbc.properties for JKS authentication
        run: |
          cat > ${TNS_ADMIN}/ojdbc.properties << 'PROPS'
          # Configured for JKS-based authentication (JDBC compatible)
          javax.net.ssl.trustStore=${TNS_ADMIN}/truststore.jks
          javax.net.ssl.trustStorePassword=${{ secrets.WALLET_PASSWORD }}
          javax.net.ssl.keyStore=${TNS_ADMIN}/keystore.jks
          javax.net.ssl.keyStorePassword=${{ secrets.WALLET_PASSWORD }}
          PROPS
          echo "✅ ojdbc.properties configured for JKS"

      # --------------------------------------------------------
      # Step 5: Configure sqlnet.ora
      # --------------------------------------------------------
      - name: Configure sqlnet.ora with wallet path
        run: |
          cat > ${TNS_ADMIN}/sqlnet.ora << SQLNET
          WALLET_LOCATION = (SOURCE = (METHOD = file) (METHOD_DATA = (DIRECTORY = ${TNS_ADMIN})))
          SSL_SERVER_DN_MATCH = yes
          SQLNET
          echo "✅ sqlnet.ora configured"

      # --------------------------------------------------------
      # Step 6: Install Liquibase (Community / OSS Edition)
      # --------------------------------------------------------
      - name: Setup Liquibase
        uses: liquibase/setup-liquibase@v2
        with:
          version: '4.32.0'
          edition: 'oss'

      # --------------------------------------------------------
      # Step 7: Validate changelogs
      # --------------------------------------------------------
      - name: Validate Liquibase changelogs
        run: |
          liquibase validate \
            --changelog-file=db/changelog/db.changelog-master.xml \
            --url="jdbc:oracle:thin:@oracletransdb_low?TNS_ADMIN=${TNS_ADMIN}" \
            --username=${{ secrets.DB_USERNAME }} \
            --password=${{ secrets.DB_PASSWORD }} \
            --default-schema-name=HR \
            --liquibase-schema-name=LIQUIBASE_DEPLOYER \
            --driver=oracle.jdbc.OracleDriver

      # --------------------------------------------------------
      # Step 8: Preview changes (dry run / update-sql)
      # --------------------------------------------------------
      - name: Preview SQL changes (update-sql)
        run: |
          liquibase update-sql \
            --changelog-file=db/changelog/db.changelog-master.xml \
            --url="jdbc:oracle:thin:@oracletransdb_low?TNS_ADMIN=${TNS_ADMIN}" \
            --username=${{ secrets.DB_USERNAME }} \
            --password=${{ secrets.DB_PASSWORD }} \
            --default-schema-name=HR \
            --liquibase-schema-name=LIQUIBASE_DEPLOYER \
            --driver=oracle.jdbc.OracleDriver > preview.sql

          cat preview.sql

          echo "### 🔍 Liquibase Dry-Run SQL Preview" >> $GITHUB_STEP_SUMMARY
          echo '```sql' >> $GITHUB_STEP_SUMMARY
          cat preview.sql >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # --------------------------------------------------------
      # Step 9: Post SQL Preview comment on Pull Request
      # --------------------------------------------------------
      - name: Comment PR with SQL Preview
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('preview.sql')) {
              let sqlContent = fs.readFileSync('preview.sql', 'utf8').trim();
              if (sqlContent.length > 60000) {
                sqlContent = sqlContent.substring(0, 60000) + '\n\n... (truncated preview)';
              }
              const body = `### 🔍 Liquibase Dry-Run SQL Preview\n\n\`\`\`sql\n${sqlContent}\n\`\`\``;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
