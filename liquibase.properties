# ============================================================
# Liquibase Configuration for Oracle Autonomous Database
# ============================================================
# This file provides default settings for local development.
# In CI/CD (GitHub Actions), these values are overridden by
# environment variables and command-line arguments.
# ============================================================

# Changelog
changeLogFile=db/changelog/db.changelog-master.xml

# Oracle Autonomous Database connection via mTLS wallet
# Update TNS_ADMIN path to your local wallet directory
url=jdbc:oracle:thin:@oracletransdb_low?TNS_ADMIN=./wallet
driver=oracle.jdbc.OracleDriver

# Credentials (override via environment or CLI for security)
username=LIQUIBASE_DEPLOYER
# password=  # Set via LB_COMMAND_PASSWORD env var or --password CLI arg

# Schema configuration
# Objects are deployed to the HR schema
defaultSchemaName=HR
# Liquibase tracking tables (DATABASECHANGELOG, DATABASECHANGELOGLOCK)
# are stored in the LIQUIBASE_DEPLOYER schema
liquibaseSchemaName=LIQUIBASE_DEPLOYER
